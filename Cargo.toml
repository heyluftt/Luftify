[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "apps/sync-server",
  "crates/luft-audio",
  "crates/luft-core",
  "crates/luft-infrastructure",
  "crates/luft-librespot",
  "crates/luft-listen-together",
  "crates/luft-modules",
  "crates/luft-setup",
]
# Vendored upstream crates are path dependencies, not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = "0.3"
keyring = "3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2"
subtle = "2"
sysinfo = "0.37"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ts-rs = { version = "11", features = ["serde-compat"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# librespot-playback 0.8.0 with a sturdier track loader (key and CDN retries);
# what changed and why: vendor/librespot-playback/LUFTIFY.md
# librespot-core 0.8.0 tries every server address (IPv4/IPv6) instead of the
# first only: vendor/librespot-core/LUFTIFY.md
[patch.crates-io]
librespot-playback = { path = "vendor/librespot-playback" }
librespot-core = { path = "vendor/librespot-core" }
