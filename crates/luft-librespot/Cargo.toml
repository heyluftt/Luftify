[package]
name = "luft-librespot"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes = "1"
chrono.workspace = true
http = "1"
http-body-util = "0.1"
# librespot-core 0.8.0's build script needs vergen 9.0.6 in Cargo.lock.
# cargo update -p vergen --precise 9.0.6
cpal = "0.16"
librespot = { version = "0.8", default-features = false, features = ["native-tls", "rodio-backend"] }
luft-audio = { path = "../luft-audio" }
luft-core = { path = "../luft-core" }
protobuf = "3"
# Same version and features as librespot-playback, so cpal is shared.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
oauth2 = "5"
open = "5"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

tempfile = "3"
