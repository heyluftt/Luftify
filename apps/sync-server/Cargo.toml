serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
